# MOD-workflow-entries' entry onMainChanged, run on every push to the default branch: it adds the graph of the pushed commit and the impact lists of its
# decision and module files that are not accepted to the branch trace-cache, and the overview of the main page of that commit to the branch overview-cache,
# where the pages read them once instead of deriving them at every load. This file does nothing but run the entry. Each branch's first commit is made
# here, once, as an orphan commit.
name: main changed

on:
  push:
    branches: [main]
  # The pages never build a graph: a push whose run failed is caught up here, for the head of main; a head already stored is `nothing to do`.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-changed
  cancel-in-progress: false

jobs:
  main-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Make the branches trace-cache and overview-cache, once, and fetch them
        run: |
          git config user.name "agent-m main-changed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in trace-cache overview-cache; do
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git checkout --orphan "$branch-first"
              git rm -rf --quiet .
              echo "The files of the commits of main, one each: <commit>.json.gz." > README.md
              git add README.md
              git commit --quiet -m "$branch: the branch of the stored files"
              git push origin "$branch-first:refs/heads/$branch"
              git checkout --quiet --detach "$GITHUB_SHA"
            fi
            git fetch origin +$branch:$branch
          done
      - name: Fetch the existing test-results branch
        run: |
          if git ls-remote --exit-code --heads origin "test-results" > /dev/null; then
            git fetch origin +test-results:test-results
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Store the records of this commit
        # A failure that passes — a network blip, the branch moved meanwhile — is tried again; the entry leaves what is stored already as it is.
        run: |
          for attempt in 1 2 3; do
            node src/workflow-entries/main.mjs onMainChanged && exit 0
            sleep $((attempt * 20))
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
