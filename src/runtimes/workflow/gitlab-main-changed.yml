# The file beside Agent M's job workflow for this product, written by Agent M (docs/architecture/MOD-runtimes.md); the product's .gitlab-ci.yml includes it. On every
# push to the default branch, on the project's pipeline schedule and on a start from this server's page, it stores what the pages read — the trace graph of the
# commit on the branch trace-cache, its overview and views on the branch overview-cache —, running Agent M's entry onMainChanged from a clone of the instance at the
# commit named below. Each branch's first commit is made here, once, as an orphan commit. It runs no agent, calls no model and reads no key. GitLab's job token
# may not push, so it writes with the person's token, scoped to the environment agent-m-write, of which this job is, as the job workflow's job that writes is.
# It takes neither the product's default: nor its global variables:.
agent-m-main-changed:
  stage: test
  image: node:22
  inherit:
    default: false
    variables: false
  environment:
    name: agent-m-write
    action: verify
  variables:
    AGENT_M_INSTANCE: "@@repository@@"
    AGENT_M_COMMIT: "@@commit@@"
    AGENT_M_TOKEN_NAME: "@@token@@"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")'
  script:
    - export AGENT_M_TOKEN="$(printenv "$AGENT_M_TOKEN_NAME")"
    - git config --global user.name "agent-m main-changed"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git clone "https://github.com/$AGENT_M_INSTANCE.git" ../instance
    - git -C ../instance checkout "$AGENT_M_COMMIT"
    # The product's clone pushes with the person's token, given by a credential helper of this clone alone, which sends it to the project's own server only.
    - git remote set-url origin "$CI_PROJECT_URL.git"
    - git config credential.helper '!f() { echo username=agent-m; echo "password=$AGENT_M_TOKEN"; }; f'
    - |
      for branch in trace-cache overview-cache; do
        if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
          git checkout --orphan "$branch-first"
          git rm -rf --quiet .
          echo "The files of the commits of the default branch, one each." > README.md
          git add README.md
          git commit --quiet -m "$branch: the branch of the stored files"
          git push origin "$branch-first:refs/heads/$branch"
          git checkout --quiet --detach "$CI_COMMIT_SHA"
        fi
        git fetch origin +$branch:$branch
      done
      if git ls-remote --exit-code --heads origin "test-results" > /dev/null; then
        git fetch origin +test-results:test-results
      else
        status=$?
        if [ "$status" -ne 2 ]; then exit "$status"; fi
      fi
    - cd ../instance && AGENT_M_PRODUCT_DIR="$CI_PROJECT_DIR" node src/workflow-entries/main.mjs onMainChanged
